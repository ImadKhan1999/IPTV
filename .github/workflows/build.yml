name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version (e.g. 1.0.0). Leave empty for a test build."
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build_name: ${{ steps.version.outputs.build_name }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      # Version name comes from the tag (v1.2.0 -> 1.2.0) or pubspec.yaml; the build number
      # always goes up, so every new APK installs over the previous one.
      - name: Version
        id: version
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "$RELEASE_INPUT" ]]; then
            name="${RELEASE_INPUT#v}"
          else
            name="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          echo "build_name=$name" >> "$GITHUB_OUTPUT"
          echo "build_number=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_OUTPUT"
          echo "Version $name ($((GITHUB_RUN_NUMBER + 100)))"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android + Android TV APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING_KEY: ${{ secrets.IPTV_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Require the signing key for releases
        if: (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release != '') && env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::error::Release builds need the IPTV_KEYSTORE_* secrets so updates install over older versions."
          exit 1
      - name: Decode signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.IPTV_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/iptv.jks" && echo "IPTV_KEYSTORE_FILE=$RUNNER_TEMP/iptv.jks" >> "$GITHUB_ENV"
      - name: Build APKs
        env:
          IPTV_KEYSTORE_PASSWORD: ${{ secrets.IPTV_KEYSTORE_PASSWORD }}
          IPTV_KEY_ALIAS: ${{ secrets.IPTV_KEY_ALIAS }}
          IPTV_KEY_PASSWORD: ${{ secrets.IPTV_KEY_PASSWORD }}
          BUILD_NAME: ${{ needs.test.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.test.outputs.build_number }}
        run: |
          flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --dart-define=APP_VERSION="$BUILD_NAME" --dart-define=APP_BUILD="$BUILD_NUMBER"
          flutter build apk --release --split-per-abi --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --dart-define=APP_VERSION="$BUILD_NAME" --dart-define=APP_BUILD="$BUILD_NUMBER"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/iPTV-universal.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp build/app/outputs/flutter-apk/app-$abi-release.apk dist/iPTV-$abi.apk
          done
          cd dist && sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: iPTV-android
          path: dist/
          retention-days: 14

  windows:
    name: Windows app
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release --build-name="${{ needs.test.outputs.build_name }}" --build-number="${{ needs.test.outputs.build_number }}" --dart-define=APP_VERSION="${{ needs.test.outputs.build_name }}" --dart-define=APP_BUILD="${{ needs.test.outputs.build_number }}"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/iPTV-windows-x64.zip
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ needs.test.outputs.build_name }} windows/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: iPTV-windows
          path: dist/
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release != ''
    needs: [test, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.build_name }}
          target_commitish: ${{ github.sha }}
          name: iPTV ${{ needs.test.outputs.build_name }}
          files: dist/*
          generate_release_notes: true
